version: "3.8"

services:
  php:
    image: php:8.2-cli
    container_name: leavem-php
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - database
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public"]
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
    build:
      context: .
      dockerfile: Dockerfile

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: leavem-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leavemanagement}
      POSTGRES_USER: ${POSTGRES_USER:-symfony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "60806:5432"  # Use 60806 to avoid conflicts with host Postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-leavemanagement}", "-U", "${POSTGRES_USER:-symfony}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:

